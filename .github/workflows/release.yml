name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build, e.g. v0.2.0'
        required: true
        type: string
      sign_and_notarize:
        description: 'Sign/notarize Mac binaries and publish a production release (requires Apple secrets)'
        required: true
        default: false
        type: boolean
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_and_notarize && 'true' || 'false' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      AGX_APPLE_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_and_notarize && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Require Apple signing configuration
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_and_notarize
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/notarize_macos.py --version "${RELEASE_TAG#v}" --check-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --release --locked
      - run: python3 scripts/check_optional.py --binary target/release/agx
      - name: Benchmark cold and warm editor search
        run: python3 scripts/benchmark_worker.py --binary target/release/agx --files 1000 --out "dist/editor-benchmark-${{ matrix.os }}.json"
      - name: Sign, notarize, and staple macOS image
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_and_notarize
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/notarize_macos.py --version "${RELEASE_TAG#v}"
      - name: Package native archive
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "$SIGN_RELEASE" == "true" ]]; then
            report=$(find dist -name '*.notarization.json' -type f)
            python3 scripts/package.py --version "${RELEASE_TAG#v}" --require-apple-signing --macos-signing-report "$report"
          else
            python3 scripts/package.py --version "${RELEASE_TAG#v}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add source and checksums
        run: |
          git archive --format=tar --prefix="agentgrep-${RELEASE_TAG#v}/" HEAD | gzip -n > "dist/agentgrep-${RELEASE_TAG#v}-source.tar.gz"
          git archive --format=zip --prefix="agentgrep-${RELEASE_TAG#v}/" HEAD > "dist/agentgrep-${RELEASE_TAG#v}-source.zip"
          python3 scripts/publish_release.py --tag "$RELEASE_TAG" --out dist --prepare-only
      - name: Publish development or manually signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$SIGN_RELEASE" == "true" ]]; then
            python3 scripts/publish_release.py --tag "$RELEASE_TAG" --out dist --signed
          else
            python3 scripts/publish_release.py --tag "$RELEASE_TAG" --out dist
          fi
