name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/check_optional.py --binary target/release/agx
      - name: Package native archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar --prefix="agentgrep-${RELEASE_TAG#v}/" HEAD | gzip -n > "dist/agentgrep-${RELEASE_TAG#v}-source.tar.gz"
          git archive --format=zip --prefix="agentgrep-${RELEASE_TAG#v}/" HEAD > "dist/agentgrep-${RELEASE_TAG#v}-source.zip"
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "agentgrep $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
