[package]
name = "agentgrep"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Local source evidence for coding agents"
repository = "https://github.com/ar4ft/agentgrep"

[[bin]]
name = "agx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
globset = "0.4"
fs2 = "0.4"
ignore = "0.4"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-swift = "0.7"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
lto = "thin"
strip = true
